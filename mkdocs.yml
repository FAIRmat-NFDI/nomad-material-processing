site_name: Documentation
site_description: |
  The documentation for NOMAD plugin nomad-material-processing.
site_author: The NOMAD Authors
repo_url: https://github.com/FAIRmat-NFDI/nomad-material-processing
edit_uri: ""

nav:
  - Home: index.md
  - Explanation:
    - Levels of Schema: explanation/levelsofschema.md
    - Schemas: explanation/schemas.md
  - How-To Guides:
    - Install this Plugin: how_to/install.md
    - Use this Plugin: how_to/use_this_plugin.md
    - Contribute to this Plugin: how_to/develop.md
  - Reference: 
    - Glossary: reference/references.md
    - Schemas: 
      - General: reference/schemas/general.md
      - Combinatorial: reference/schemas/combinatorial.md
      - Epitaxy: reference/schemas/epitaxy.md
      - Crystal Growth: reference/schemas/crystal_growth.md
      - Solution:
        - General: reference/schemas/solution/general.md
      - Vapor Deposition:
        - General: reference/schemas/vapor_deposition/general.md
        - CVD:
          - General: reference/schemas/vapor_deposition/cvd/general.md
          - MOVPE: reference/schemas/vapor_deposition/cvd/movpe.md
        - PVD:
          - General: reference/schemas/vapor_deposition/pvd/general.md
          - Sputtering: reference/schemas/vapor_deposition/pvd/sputtering.md
          - Thermal Evaporation: reference/schemas/vapor_deposition/pvd/thermal.md
          - Pulsed Laser Deposition: reference/schemas/vapor_deposition/pvd/pld.md
          - Molecular Beam Epitaxy: reference/schemas/vapor_deposition/pvd/mbe.md
  - Tutorials: tutorial/tutorial.md
  - Contact: contact.md
plugins:
 - search
 - macros:
    module_name: docs/main
theme:
  name: material
  palette:
    primary: '#2A4CDF'
    accent: '#008A67'
  font:
    text: 'Titillium Web'
  logo: assets/nomad-plugin-logo.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
  custom_dir: docs/theme
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: True
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - mkdocs-click
  - pymdownx.extra
extra:
  generator: false
  homepage: https://nomad-lab.eu
use_directory_urls: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascript.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
